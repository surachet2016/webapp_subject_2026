<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero และการ์ดสินค้า</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="bg-light py-5 text-center">
  <div class="container">
    <h1 class="display-5 fw-bold">ร้านค้าออนไลน์</h1>
    <p class="lead">สินค้าคุณภาพ จัดส่งทั่วประเทศ</p>
    <a href="#products" class="btn btn-primary btn-lg">ดูสินค้า</a>
  </div>
</header>
<main id="products" class="container my-4">
  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">สินค้า 1</h5>
          <p class="card-text">รายละเอียดสินค้า</p>
          <a href="#" class="btn btn-outline-primary">สั่งซื้อ</a>
        </div>
      </div>
    </div>
    <!-- ทำซ้ำ div.col-12.col-md-6.col-lg-4 สำหรับสินค้าชิ้นอื่น -->
  </div>
</main>
</body>
</html>
